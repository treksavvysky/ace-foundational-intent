[project]
name = "ace-telemetry-ingest"
version = "0.1.0"
description = "ACE Foundational Intent - Telemetry Ingest Service"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "UP017",  # datetime.UTC requires Python 3.11+
]

[tool.ruff.lint.isort]
known-first-party = ["src", "schemas"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
